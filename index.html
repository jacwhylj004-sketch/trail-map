<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Trail Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https: data: blob:">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="map"></div>

<form id="search" role="search" autocomplete="off">
  <button type="button" class="icon-btn" data-act="search-clear" aria-label="Clear search" id="search-x" hidden></button>
  <button type="button" class="icon-btn" data-act="search-hide" aria-label="Hide the search box" id="search-hide"></button>
  <input id="q" type="search" placeholder="Search places, routes or grid ref" aria-label="Search" enterkeyhint="search">
  <button type="submit" class="icon-btn" aria-label="Search" id="search-go"></button>
</form>
<div id="tops">
  <button id="chip" data-act="chip-close" aria-label="Close this message" hidden><span id="chip-text"></span><span id="chip-x"></span></button>
  <div id="routebar" hidden>
    <button id="routebar-open" data-act="route-open"><b id="routebar-title"></b><span id="routebar-detail"></span></button>
    <button class="icon-btn" data-act="route-remove" aria-label="Remove from the map" id="routebar-x"></button>
  </div>
</div>
<div id="back" role="status" data-act="back-size" hidden>
  <svg id="back-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 20l8-4.500 8 4.500z" fill="currentColor"/></svg>
  <div class="grow"><b id="back-title"></b><span id="back-detail"></span></div>
  <span class="folder"></span>
  <button class="btn" data-act="back-stop">Stop</button>
</div>

<div id="nav-top" role="status" data-act="nav-size" hidden>
  <div id="nav-arrow"></div>
  <div class="grow"><b id="nav-dist"></b><span id="nav-text"></span><small id="nav-then"></small></div>
  <span class="folder"></span>
  <p id="nav-warn" hidden></p>
</div>
<div id="nav-bottom" hidden>
  <div id="nav-more" hidden></div>
  <button id="nav-more-btn" data-act="nav-more" aria-expanded="false"></button>
  <div class="grow"><b id="nav-time"></b><span id="nav-left"></span></div>
  <button class="icon-btn" data-act="nav-voice" id="nav-voice" aria-label="Voice directions"></button>
  <button class="btn" data-act="nav-view" id="nav-view">Overview</button>
  <button class="btn stop" data-act="nav-exit">Exit</button>
</div>

<div id="fabs">
  <button class="fab small" data-act="layers" aria-label="Map layers" id="fab-layers"></button>
  <button class="fab small" data-act="north" aria-label="Point north up" id="fab-north" hidden></button>
  <button class="fab small" data-act="zoom-in" aria-label="Zoom in" id="fab-in"></button>
  <button class="fab small" data-act="zoom-out" aria-label="Zoom out" id="fab-out"></button>
  <button class="fab small" data-act="record" aria-label="Record a walk" id="fab-rec"></button>
  <button class="fab small" data-act="full" aria-label="Full map" id="fab-full"></button>
  <button class="fab" data-act="locate" aria-label="Show my location" id="fab-locate"></button>
</div>

<div id="gpsbox" hidden>
  <button id="gps" data-act="where"></button>
  <button id="gps-hide" data-act="gps-hide" aria-label="Hide this box"></button>
  <button id="gps-show" data-act="gps-show" aria-label="Show altitude and speed" hidden></button>
</div>

<section id="sheet" aria-live="polite" hidden>
  <div id="sheet-head"><div class="grow" data-act="sheet-min"><h2 id="sheet-title"></h2><span id="sheet-sub" class="muted small" hidden></span></div><button class="btn primary" id="sheet-act" hidden></button><button class="icon-btn" id="sheet-min" data-act="sheet-min"></button><button class="icon-btn" data-act="close" aria-label="Close" id="sheet-x"></button></div>
  <div id="sheet-body"></div>
</section>

<section id="page" hidden>
  <header><h1>Settings</h1></header>
  <div id="page-body"></div>
</section>

<div id="area" hidden>
  <div id="area-frame"></div>
  <div id="area-panel">
    <strong>Fit the box over the area</strong>
    <input id="area-name" type="text" maxlength="60" placeholder="Name, e.g. Lake District" aria-label="Name for this offline map">
    <p id="area-size" class="small"></p>
    <div class="row end"><button class="btn" data-act="area-cancel">Cancel</button><button class="btn primary" data-act="area-download" id="area-go">Download</button></div>
  </div>
</div>

<nav id="nav" aria-label="Sections"></nav>
<div id="toast" role="status" hidden></div>
<div id="dialog" hidden><div class="box"><h3 id="dialog-title"></h3><p id="dialog-text"></p><input id="dialog-input" type="text" maxlength="80" aria-label="Name"><div class="row end"><button class="btn" id="dialog-no">Cancel</button><button class="btn primary" id="dialog-yes">OK</button></div></div></div>

<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/maplibre-contour.js"></script>
<script src="js/core.js"></script>
<script src="js/mvt.js"></script>
<script src="js/offline.js"></script>
<script src="js/find.js"></script>
<script src="js/router.js"></script>
<script src="js/safety.js"></script>
<script src="js/walker.js"></script>
<script src="js/osmap.js"></script>
<script src="js/paths.js"></script>
<script src="js/barriers.js"></script>
<script src="js/packs.js"></script>
<script src="js/map.js"></script>
<script src="js/routes.js"></script>
<script src="js/plan.js"></script>
<script src="js/update.js"></script>
<script src="js/record.js"></script>
<script src="js/graphs.js"></script>
<script src="js/back.js"></script>
<script src="js/navigate.js"></script>
<script src="js/ui.js"></script>
<script src="js/space.js"></script>
</body>
</html>
